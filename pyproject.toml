[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-sidebar-repair"
version = "0.1.0"
description = "Repair local Codex Desktop sidebar history after provider switches."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "codex-sidebar-repair contributors" }]
keywords = ["codex", "desktop", "sqlite", "history", "repair"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]

[project.scripts]
codex-sidebar-repair = "codex_sidebar_repair.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

